name: Update Release v1.2.0

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/release-v1.2.0.yml'

permissions:
  contents: write

jobs:
  build-and-update-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew --no-daemon clean assembleRelease

      - name: Prepare release asset
        run: cp app/build/outputs/apk/release/app-release.apk noticias-muy-interesante-v1.2.0.apk

      - name: Update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > RELEASE_NOTES.md <<'NOTES'
          ## v1.2.0 - Noticias Muy Interesante

          Actualización visual y de identidad de la aplicación, manteniendo el infinite scroll incorporado en v1.1.0.

          ### Cambios principales
          - La aplicación pasa a mostrarse como **Noticias Muy Interesante**.
          - Nuevo icono de launcher moderno integrado como recurso WebP de alta resolución.
          - Se mantiene la carga progresiva de noticias antiguas mediante infinite scroll.
          - Se mantiene la deduplicación de noticias y la caché offline.
          - Versión actualizada a 1.2.0 (`versionCode 3`).
          NOTES

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f v1.2.0 "$GITHUB_SHA"
          git push origin -f refs/tags/v1.2.0

          gh release upload v1.2.0 noticias-muy-interesante-v1.2.0.apk \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

          gh release edit v1.2.0 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "v1.2.0 - Noticias Muy Interesante" \
            --notes-file RELEASE_NOTES.md
