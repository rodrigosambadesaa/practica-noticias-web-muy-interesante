name: Muy Interesante - v1.2.9 signed release
on:
  push:
    branches: [ master ]
    paths: [ '.github/workflows/news-modernization-release.yml' ]
permissions:
  contents: write
jobs:
  test-build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Validate AndroidX, Glide and permissions
        run: |
          grep -q "versionName \"1.2.9\"" app/build.gradle
          grep -q 'androidx.appcompat.widget.SearchView' app/src/main/res/menu/main.xml
          grep -q 'showSoftInput' app/src/main/java/com/example/muyinteresante/MainActivity.java
          grep -q "glide:4.16.0" app/build.gradle
          test ! -e app/src/main/java/com/example/muyinteresanteNoTocar/AsignaImagenDeURL.java
          ! grep -q 'android.permission.WRITE_EXTERNAL_STORAGE' app/src/main/AndroidManifest.xml
      - name: Test and assemble debug
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Prepare production signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "Missing ANDROID_KEYSTORE_BASE64; refusing to publish unsigned APK"; exit 1; }
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          chmod 600 "$RUNNER_TEMP/release.keystore"
      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon :app:assembleRelease
          test -s app/build/outputs/apk/release/app-release.apk
      - name: Publish GitHub Release v1.2.9
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          - Migración a AndroidX y Glide 4.16.0 con mejor reciclado de vistas e imágenes.
          - Búsqueda interactiva: teclado al pulsar la lupa y filtrado inmediato por título y descripción.
          - Al cerrar el buscador se recupera la lista completa de noticias.
          - Limpieza de WebView al salir de un artículo para prevenir fugas de memoria.
          - Fecha formateada y descripción saneada precalculadas; eliminada la caché externa innecesaria y el permiso WRITE_EXTERNAL_STORAGE.
          - Firma de distribución con el almacén de claves del proyecto configurado en GitHub Actions.
          EOF
          gh release create v1.2.9 app/build/outputs/apk/release/app-release.apk \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "v1.2.9 — AndroidX, Glide y buscador funcional" --notes-file release-notes.md
