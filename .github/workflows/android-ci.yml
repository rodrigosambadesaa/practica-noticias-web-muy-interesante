name: Android CI — Muy Interesante
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install Android API 35
        run: sdkmanager "platforms;android-35"
      - name: Validate permissions and Glide migration
        run: |
          test ! -e app/src/main/java/com/example/muyinteresanteNoTocar/AsignaImagenDeURL.java
          ! grep -R -E 'android.support.|AsignaImagenDeURL' --include='*.java' app/src/main/java
          ! grep -q 'android.permission.WRITE_EXTERNAL_STORAGE' app/src/main/AndroidManifest.xml
          grep -q 'androidx.appcompat.widget.SearchView' app/src/main/res/menu/main.xml
      - name: Test and assemble debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: noticias-muy-interesante-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
