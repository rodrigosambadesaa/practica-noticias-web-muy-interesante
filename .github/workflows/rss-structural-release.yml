name: RSS structural refactor - signed release
on:
  push:
    branches: [master, refactor/rss-architecture-muy-interesante]
permissions:
  contents: write
jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Validate migration
        run: |
          ! grep -q 'DocumentBuilderFactory' app/src/main/java/com/example/muyinteresanteNoTocar/DescargaNoticiasRSS.java
          grep -q 'XmlPullParser' app/src/main/java/com/example/muyinteresanteNoTocar/RssPullParser.java
          ! grep -q 'configChanges=' app/src/main/AndroidManifest.xml
          ! grep -q 'onConfigurationChanged' app/src/main/java/com/example/muyinteresante/MainActivity.java
          grep -q 'ViewModelProvider' app/src/main/java/com/example/muyinteresante/MainActivity.java
          grep -q 'newSingleThreadExecutor' app/src/main/java/com/example/muyinteresante/util/NewsCacheManager.java
          ! grep -Eq 'NewsCacheManager\.loadNewsFromCache\(this\);' app/src/main/java/com/example/muyinteresante/MainActivity.java
      - name: Unit tests and Debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Prepare signing key for main
        if: github.ref == 'refs/heads/master'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "Missing ANDROID_KEYSTORE_BASE64"; exit 1; }
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          chmod 600 "$RUNNER_TEMP/release.keystore"
      - name: Build signed release APK
        if: github.ref == 'refs/heads/master'
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon :app:assembleRelease
          test -s app/build/outputs/apk/release/app-release.apk
      - name: Publish GitHub release
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          - 🚀 Rendimiento: Optimizada la memoria RAM durante la descarga mediante la lectura de flujo del XML (XmlPullParser).
          - 🔄 Fluidez: Lectura y escritura de la caché local movidas a hilos secundarios; la app ahora arranca sin esperar al disco.
          - 📱 UI Moderna: Añadido soporte real para rotaciones de pantalla gracias a ViewModel.
          - 🌍 Internacionalización: Textos visibles extraídos al archivo de recursos para facilitar futuras traducciones.
          - 🔐 Firma de distribución con las credenciales protegidas del repositorio.
          EOF
          gh release create v1.3.0 app/build/outputs/apk/release/app-release.apk \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "v1.3.0 — Caché asíncrona, XmlPullParser y ViewModel" --notes-file release-notes.md
