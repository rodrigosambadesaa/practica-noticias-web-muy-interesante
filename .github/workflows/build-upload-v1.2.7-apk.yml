name: Build and upload v1.2.7 APK

on:
  push:
    paths:
      - '.github/workflows/build-upload-v1.2.7-apk.yml'

permissions:
  contents: write

jobs:
  build-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v1.2.6 base
        uses: actions/checkout@v4
        with:
          ref: v1.2.6
          fetch-depth: 0
      - name: Apply v1.2.7 timeout fix and version bump
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/example/muyinteresanteNoTocar/DescargaNoticiasRSS.java')
          s = p.read_text()
          s = s.replace('conex.setConnectTimeout(10000);', 'conex.setConnectTimeout(15000);')
          s = s.replace('conex.setReadTimeout(10000);', 'conex.setReadTimeout(30000);')
          p.write_text(s)
          p = Path('app/build.gradle')
          s = p.read_text().replace('versionCode 10', 'versionCode 11').replace('versionName "1.2.6"', 'versionName "1.2.7"')
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle app/src/main/java/com/example/muyinteresanteNoTocar/DescargaNoticiasRSS.java
          git commit -m "fix: release v1.2.7 con timeouts seguros 15s/30s"
          echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Configure release signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo 'Missing ANDROID_KEYSTORE_BASE64'; exit 1; }
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
      - name: Build signed APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleRelease
          test -f app/build/outputs/apk/release/app-release.apk
      - name: Retarget release and upload APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f v1.2.7 "$RELEASE_SHA"
          git push origin -f refs/tags/v1.2.7
          gh release edit v1.2.7 --repo "$GITHUB_REPOSITORY" --target "$RELEASE_SHA"
          gh release upload v1.2.7 app/build/outputs/apk/release/app-release.apk --repo "$GITHUB_REPOSITORY" --clobber
