name: Release v1.1.0

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/release-v1.1.0.yml'

permissions:
  contents: write

# CVE-2026-114938: protect Java build/release tooling.
env:
  JAVA_TOOL_OPTIONS: -XX:-UseBASE64Intrinsics

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check immutable historical v1.1.0 release
        id: release_state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.1.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::v1.1.0 already published: preserving the original signed artifact."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Make Gradle wrapper executable
        if: steps.release_state.outputs.exists != 'true'
        run: chmod +x gradlew

      - name: Verify source version matches historical tag
        if: steps.release_state.outputs.exists != 'true'
        run: |
          grep -Eq 'versionName[[:space:]]+"1\.1\.0"' app/build.gradle

      - name: Prepare verified Android release keystore
        if: steps.release_state.outputs.exists != 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "::error::Missing ANDROID_KEYSTORE_BASE64; never publish unsigned APK."; exit 1; }
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          chmod 600 "$RUNNER_TEMP/release.keystore"

      - name: Build release APK
        if: steps.release_state.outputs.exists != 'true'
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Prepare release asset
        if: steps.release_state.outputs.exists != 'true'
        run: cp app/build/outputs/apk/release/app-release.apk practica-noticias-v1.1.0.apk

      - name: Create GitHub release
        if: steps.release_state.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > RELEASE_NOTES.md <<'EOF'
          ## v1.1.0 - Infinite scroll y noticias antiguas

          Esta versión incorpora carga progresiva de noticias antiguas al llegar al final del listado.

          ### Cambios principales
          - Infinite scroll en el RecyclerView.
          - Precarga automática cuando quedan pocas noticias para llegar al final.
          - Uso del feed oficial de Muy Interesante y paginación mediante páginas RSS.
          - Acumulación de noticias sin reemplazar las ya mostradas.
          - Eliminación de duplicados por URL y, como respaldo, por título y fecha.
          - Protección contra peticiones simultáneas y páginas repetidas.
          - Las páginas adicionales se descargan sin ProgressDialog modal.
          - Persistencia de las noticias acumuladas en la caché offline.
          - Actualización de versión a 1.1.0 (versionCode 2).
          EOF

          if gh release view "v1.1.0" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::Release v1.1.0 already exists; preserving its tag and signed APK."
            exit 0
          fi
          gh release create v1.1.0 practica-noticias-v1.1.0.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "v1.1.0 - Infinite scroll y noticias antiguas" \
            --notes-file RELEASE_NOTES.md
