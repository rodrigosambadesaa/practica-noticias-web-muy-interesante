name: Release v1.1.0

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/release-v1.1.0.yml'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Prepare release asset
        run: cp app/build/outputs/apk/release/app-release.apk practica-noticias-v1.1.0.apk

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > RELEASE_NOTES.md <<'EOF'
          ## v1.1.0 - Infinite scroll y noticias antiguas

          Esta versión incorpora carga progresiva de noticias antiguas al llegar al final del listado.

          ### Cambios principales
          - Infinite scroll en el RecyclerView.
          - Precarga automática cuando quedan pocas noticias para llegar al final.
          - Uso del feed oficial de Muy Interesante y paginación mediante páginas RSS.
          - Acumulación de noticias sin reemplazar las ya mostradas.
          - Eliminación de duplicados por URL y, como respaldo, por título y fecha.
          - Protección contra peticiones simultáneas y páginas repetidas.
          - Las páginas adicionales se descargan sin ProgressDialog modal.
          - Persistencia de las noticias acumuladas en la caché offline.
          - Actualización de versión a 1.1.0 (versionCode 2).
          EOF

          gh release create v1.1.0 practica-noticias-v1.1.0.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "v1.1.0 - Infinite scroll y noticias antiguas" \
            --notes-file RELEASE_NOTES.md
