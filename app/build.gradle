plugins {
    id 'com.android.application'
}

def generatedLauncherResDir = file("$buildDir/generated/launcherIcon/res")
def launcherIconParts = fileTree("$projectDir/icon-source") {
    include 'icon.part*'
}

android {
    namespace 'com.example.muyinteresante'
    compileSdkVersion 35

    defaultConfig {
        applicationId "com.example.muyinteresante"
        minSdkVersion 17
        targetSdkVersion 35
        versionCode 3
        versionName "1.2.0"
    }

    sourceSets {
        main {
            // El icono de launcher se reconstruye desde los fragmentos Base64
            // antes de compilar. Esto mantiene en Git un recurso textual fiable
            // y genera un JPEG estándar que AAPT2 acepta sin problemas.
            res.srcDir generatedLauncherResDir
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

tasks.register('generateLauncherIcon') {
    inputs.files(launcherIconParts)
    def outputFile = file("$generatedLauncherResDir/drawable-nodpi/ic_launcher.jpg")
    outputs.file(outputFile)

    doLast {
        if (launcherIconParts.files.isEmpty()) {
            throw new GradleException('No se encontraron los fragmentos del icono de launcher.')
        }

        outputFile.parentFile.mkdirs()
        def encoded = launcherIconParts.files
                .toList()
                .sort { a, b -> a.name <=> b.name }
                .collect { it.getText('UTF-8').trim() }
                .join('')

        outputFile.bytes = java.util.Base64.decoder.decode(encoded)
    }
}

tasks.named('generateLauncherIcon').configure {
    mustRunAfter(tasks.named('clean'))
}

tasks.named('preBuild').configure {
    dependsOn(tasks.named('generateLauncherIcon'))
}

dependencies {
    implementation 'com.android.support:appcompat-v7:28.0.0'
    implementation 'com.android.support:recyclerview-v7:28.0.0'
    implementation 'com.android.support:cardview-v7:28.0.0'
    implementation 'com.android.support:design:28.0.0'
    implementation 'com.android.support:support-v4:28.0.0'
}
